[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "1.0.0"
description = "ORBIT: Orthogonal Rotation for Biological Inter-species Transfer. Closed-form alignment of gene network embeddings across species."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Paul Wissenberg", email = "paul@rockflour.co" },
    { name = "Jia Min Lee" },
    { name = "Marek Mutwil", email = "mutwil@plen.ku.dk" },
]
keywords = ["bioinformatics", "coexpression networks", "protein interaction networks", "cross-species alignment", "orthogonal Procrustes"]
# The rotation needs NumPy, SciPy (for the SVD) and HDF5; it runs on any laptop.
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "h5py>=3.10.0",
]

[project.optional-dependencies]
# `orbit embed`: Node2Vec embedding of your own coexpression networks (pecanpy + gensim).
embed = [
    "pecanpy>=2.0.0",
    "gensim>=4.3.0",
    "numba>=0.59.0",
]
# scripts/downstream/: the downstream benchmarks of the paper (Sections 2.7 and 2.8).
paper = [
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "cafaeval>=1.3.0",
]

[project.scripts]
orbit = "orbit.cli:main"

[dependency-groups]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
